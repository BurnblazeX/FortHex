# === Cloudflare Tunnel — forthex.xyz -> this machine ===
#
# Goes at ~/.cloudflared/config.yml on the server (or /etc/cloudflared/config.yml if
# you install it as a system service). Replace TUNNEL-UUID in both places with what
# `cloudflared tunnel create forthex` prints.
#
# WHY A TUNNEL. The router's WAN address is 10.35.91.250 — RFC1918, handed out by the
# ISP over PPPoE. That is carrier-grade NAT: there is no public address on the router
# to forward a port from, so no router configuration can expose this machine. The
# tunnel works by dialling OUT to Cloudflare, which needs no inbound port at all.
#
# What it buys beyond reachability: real TLS on forthex.xyz (which matters to this
# codebase — see host/Caddyfile), the home IP stays hidden, and WebSockets are
# proxied, so B2's game server can ride the same tunnel with no new infrastructure.

tunnel: TUNNEL-UUID
credentials-file: /home/bun_blazey/.cloudflared/TUNNEL-UUID.json

# Keep the connection healthy through the ISP's NAT, which will otherwise reap an
# idle mapping and leave the site briefly unreachable.
keep-alive-connections: 4
grace-period: 30s

ingress:
  # The static game. Caddy is the origin, bound to localhost only.
  - hostname: forthex.xyz
    service: http://localhost:8080

  # Reserved for the Node game server (B2). Left commented rather than pointed at
  # nothing: cloudflared refuses to start on an ingress rule it cannot validate, and
  # a broken tunnel takes the static site down with it.
  # - hostname: forthex.xyz
  #   path: ^/ws
  #   service: ws://localhost:8081

  # Required terminator — every ingress list must end with a catch-all.
  - service: http_status:404
